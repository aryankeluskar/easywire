<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>easywire</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #EDEBFF, #DDE5F5);
            min-height: 100vh;
            color: #1F1F1F;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
        }

        .logo {
            color: #FFD700;
            font-size: 24px;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.1));
        }

        nav a {
            color: #1F1F1F;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: all 0.2s;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Content Styles */
        .main-content {
            text-align: center;
            padding: 80px 0;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0px 1px 2px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease-out;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            animation: slideUp 0.5s ease-out;
        }

        .description {
            font-size: 14px;
            color: #6C6C6C;
            margin-bottom: 40px;
            animation: slideUp 0.5s ease-out 0.2s;
        }

        /* Form Styles */
        .form-container {
            background: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D1D1D1;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #A58CFF;
            box-shadow: 0 0 0 2px rgba(165,140,255,0.2);
            transform: scale(1.02);
            outline: none;
        }

        button {
            width: 320px;
            height: 48px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #050505;
            box-shadow: 0 0 15px rgba(165,140,255,0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            button {
                width: 100%;
            }

            nav a {
                font-size: 12px;
                margin-left: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">💰</div>
            <nav>
                <a href="#">GitHub</a>
                <a href="#">Perplexity</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <div class="main-content">
            <h1>easywire</h1>
            <p class="subtitle">Never lose to currency fluctuations ever again.</p>
            <p class="description">
                Uses technical and sentiment analysis to save you money on international transfers.
                <i>(Work In Progress)</i>
            </p>

            <div class="form-container">
                <form>
                    <div class="input-group">
                        <input type="text" placeholder="Enter your transaction amount..." aria-label="Transaction amount">
                    </div>
                    <div class="input-group">
                        <input type="date" placeholder="01/05/2025" aria-label="Deadline">
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Enter your email..." aria-label="Email address">
                    </div>
                    <button type="submit" aria-label="Submit transaction">Submit Transaction</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
